<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divoce aneb Holky na tahu · 31. 10. Žlutý pes Pardubice</title>
<meta name="description" content="První koncert dua Divoce: sobota 31. 10. od 20 hodin, Music Club Žlutý pes, Pardubice. Vstupné 250 Kč.">
<meta name="theme-color" content="#fec3e8">
<meta property="og:type" content="website">
<meta property="og:title" content="Divoce aneb Holky na tahu">
<meta property="og:description" content="První koncert dua Divoce · sobota 31. 10. od 20 hodin · Music Club Žlutý pes, Pardubice">
<meta property="og:image" content="assets/divoce-duo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,300..700;1,62.5..100,300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fec3e8;
    --ink: #290203;
    --line: rgba(41, 2, 3, .2);
    --card: #fff8fb;
    --card-ink: #290203;
    --pad-x: clamp(20px, 4vw, 56px);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Serif Display', serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  a:hover { opacity: .8; }

  .label {
    font-size: 13px;
    letter-spacing: .3em;
    text-transform: uppercase;
  }

  /* Hero: logo + ticket card fit the first screen on desktop */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 var(--pad-x) clamp(24px, 4vh, 56px);
  }
  header {
    align-self: stretch;
    padding: 22px 0;
    font-size: 14px;
    letter-spacing: .24em;
    text-transform: uppercase;
  }
  header a { text-decoration: none; }

  /* Instagram glyph, single colour (currentColor) */
  .ig-link {
    display: inline-flex;
    align-items: center;
    gap: .6em;
    text-decoration: none;
  }
  .ig { width: 1.3em; height: 1.3em; flex: none; }

  /* The logo viewBox is symmetric around "Divoce!" (taglines stick out to the
     sides), so centering the image centers the word itself. */
  .logo {
    position: relative;
    width: 100%;
    aspect-ratio: 816 / 511;
    max-width: 560px;
    margin: 8px 0 32px;
  }
  .logo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .ticket {
    width: min(100%, 1040px);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
    background: var(--card);
    color: var(--card-ink);
    border-radius: 18px;
    overflow: hidden;
    container-type: inline-size;
  }
  .ticket__photo {
    position: relative;
    min-height: 360px;
    background: #111;
  }
  .ticket__photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 64%;
  }
  .ticket__body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 28px;
    padding: clamp(24px, 3.4vw, 44px);
    border-left: 2px dashed var(--card-ink);
  }
  /* Stacked card (narrow screens): perforation runs between photo and text */
  @container (max-width: 639px) {
    .ticket__body { border-left: 0; border-top: 2px dashed var(--card-ink); }
  }
  .ticket__head { display: flex; flex-direction: column; gap: 10px; }
  h1 {
    margin: 0;
    font-size: clamp(40px, 5vw, 64px);
    line-height: .95;
    font-weight: 600;
    font-stretch: extra-condensed;
    text-wrap: balance;
  }
  dl {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 22px;
    row-gap: 10px;
    font-size: 18px;
  }
  dt { font-style: italic; font-stretch: extra-condensed; }
  dd { margin: 0; }
  .strong { font-weight: 600; }
  .cta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 20px 26px;
    background: var(--card-ink);
    color: var(--card);
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    border-radius: 999px;
  }

  /* Desktop: the hero takes exactly the first screen, the logo gets whatever
     height is left after the header and the ticket card. */
  @media (min-width: 900px) and (orientation: landscape) {
    .hero { min-height: 100vh; min-height: 100svh; }
    .logo {
      flex: 1 1 0;
      aspect-ratio: auto;
      min-height: 140px;
      max-height: 440px;
      max-width: none;
      margin: 0 0 clamp(16px, 3.5vh, 48px);
    }
    /* very tall screens: spare height goes evenly above the logo and below the card */
    .logo { margin-top: auto; }
    .ticket { margin-bottom: auto; }
    .ticket__photo { min-height: 0; }
    .ticket__body {
      gap: clamp(14px, 2.6vh, 28px);
      padding: clamp(20px, 3.4vh, 44px) clamp(24px, 3.4vw, 44px);
    }
    h1 { font-size: clamp(34px, min(5vw, 6vh), 64px); }
    dl { font-size: clamp(15px, 2.1vh, 18px); row-gap: clamp(4px, 1vh, 10px); }
    .cta { padding: clamp(12px, 2vh, 20px) 26px; }
  }

  .about {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: clamp(56px, 7vw, 110px) var(--pad-x);
    border-top: 1px solid var(--line);
    text-align: center;
  }
  .about .ig-cta {
    padding: 14px 26px;
    border: 1px solid var(--ink);
    border-radius: 999px;
    font-size: 15px;
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  .about .ig-cta .ig { width: 22px; height: 22px; }
  .about p {
    margin: 0;
    max-width: 760px;
    font-size: clamp(26px, 3.2vw, 40px);
    line-height: 1.2;
    font-style: italic;
    font-stretch: extra-condensed;
    text-wrap: balance;
  }

  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px;
    padding: 26px var(--pad-x);
    border-top: 1px solid var(--line);
    font-size: 15px;
    letter-spacing: .08em;
  }
  footer a { text-decoration: none; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="ig" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
      <circle cx="12" cy="12" r="4.3"/>
      <circle cx="17.6" cy="6.4" r="1.1" fill="currentColor" stroke="none"/>
    </symbol>
  </svg>
  <section class="hero">
    <header>
      <a class="ig-link" href="https://www.instagram.com/divoceduo" target="_blank" rel="noopener" aria-label="Instagram @divoceduo"><svg class="ig" viewBox="0 0 24 24" aria-hidden="true"><use href="#ig"/></svg>@divoceduo</a>
    </header>
    <div class="logo">
      <img src="assets/divoce-logo.svg" alt="Divoce! chceme liDI, chceme VOlnost, chceme hodně tanCE">
    </div>
    <article class="ticket">
      <div class="ticket__photo">
        <img src="assets/divoce-duo.jpg" alt="Divoce duo na pódiu">
      </div>
      <div class="ticket__body">
        <div class="ticket__head">
          <span class="label">První koncert</span>
          <h1>Divoce aneb Holky na tahu</h1>
        </div>
        <dl>
          <dt>Kdy</dt><dd class="strong">sobota 31. 10. od 20 hodin</dd>
          <dt>Kde</dt><dd>Music Club Žlutý pes<br>Ke koupališti 62, Pardubice</dd>
          <dt>Vstupné</dt><dd>250 Kč</dd>
        </dl>
        <a class="cta" href="https://www.smsticket.cz/vstupenky/75161-divoce-aneb-holky-na-tahu-pardubice-music-club-zluty-pes-pardubice" target="_blank" rel="noopener">Koupit vstupenku <span aria-hidden="true">→</span></a>
      </div>
    </article>
  </section>

  <section class="about">
    <span class="label">O nás</span>
    <p>Alice Vacková &amp; Adéla Gottvaldová</p>
    <a class="ig-link ig-cta" href="https://www.instagram.com/divoceduo" target="_blank" rel="noopener"><svg class="ig" viewBox="0 0 24 24" aria-hidden="true"><use href="#ig"/></svg>Kdo jsme? Na Instagramu</a>
  </section>

  <footer>
    <a class="ig-link" href="https://www.instagram.com/divoceduo" target="_blank" rel="noopener"><svg class="ig" viewBox="0 0 24 24" aria-hidden="true"><use href="#ig"/></svg>Instagram @divoceduo</a>
  </footer>
</body>
</html>
