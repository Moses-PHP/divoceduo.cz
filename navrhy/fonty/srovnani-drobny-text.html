<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonty pro Divoce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,300..700;1,62.5..100,300..700&family=Noto+Serif:ital,wdth,wght@0,62.5..100,300..700;1,62.5..100,300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Archivo:ital,wdth,wght@0,62..125,300..700;1,62..125,300..700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg: #290203; --ink: #fec3e8; --card: #561a20; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Serif Display', serif; -webkit-font-smoothing: antialiased; padding: 32px 16px 80px; }
  .intro { max-width: 1100px; margin: 0 auto 32px; font: 15px/1.5 system-ui, sans-serif; }
  .intro h1 { font: 600 28px/1.1 system-ui, sans-serif; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
  .v { background: var(--card); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  .v.cur { outline: 2px dashed var(--ink); }
  .tag { font: 600 12px/1.3 system-ui, sans-serif; opacity: .65; }
  .tag b { display: block; font-size: 16px; opacity: 1; margin-bottom: 2px; }
  .label { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; }
  .h { font-family: 'Noto Serif Display', serif; font-size: 40px; line-height: .95; font-weight: 600; font-stretch: extra-condensed; margin: 0; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 18px; row-gap: 6px; font-size: 16px; }
  dt { font-style: italic; } dd { margin: 0; } .strong { font-weight: 600; }
  .cta { display: flex; justify-content: space-between; padding: 14px 22px; background: var(--ink); color: var(--card); font-size: 14px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; border-radius: 999px; }
  .ig { align-self: start; padding: 10px 18px; border: 1px solid var(--ink); border-radius: 999px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
  p { margin: 0; font-size: 17px; line-height: 1.6; }
  p.small { font-size: 14px; line-height: 1.5; }

  .f-cur  { font-family: 'Noto Serif Display', serif; }
  .f-cur dt { font-stretch: extra-condensed; }
  .f-ns   { font-family: 'Noto Serif', serif; }
  .f-ns dt { font-stretch: condensed; }
  .f-ss4  { font-family: 'Source Serif 4', serif; font-optical-sizing: auto; }
  .f-news { font-family: 'Newsreader', serif; font-optical-sizing: auto; }
  .f-lit  { font-family: 'Literata', serif; font-optical-sizing: auto; }
  .f-arch { font-family: 'Archivo', sans-serif; font-stretch: 90%; }
  .f-arch dt { font-family: 'Noto Serif Display', serif; font-stretch: extra-condensed; font-size: 1.1em; }
  .f-arch p { font-stretch: 100%; }
</style>
</head>
<body>
<div class="intro">
  <h1>Fonty pro drobný text – srovnání</h1>
  Nadpisy (velké písmo) zůstávají ve všech variantách v Noto Serif Display. Mění se jen štítky, údaje o koncertu, tlačítka a odstavce. První karta je současný stav.
</div>
<div class="grid" id="grid"></div>
<template id="tpl">
  <span class="label">První koncert</span>
  <h2 class="h">Divoce aneb Holky na tahu</h2>
  <dl>
    <dt>Kdy</dt><dd class="strong">sobota 31. 10. od 20 hodin</dd>
    <dt>Kde</dt><dd>Music Club Žlutý pes<br>Ke koupališti 62, Pardubice</dd>
    <dt>Vstupné</dt><dd>250 Kč</dd>
  </dl>
  <span class="cta">Koupit vstupenku <span>→</span></span>
  <p>Potkaly jsme se na zpěvu v&nbsp;ZUŠce, kde jsme se staly součástí milovaného sexteta Gmajor6. Ladí nám to spolu, chceme makat a&nbsp;hlavně tohle celé posunout zase někam dál.</p>
  <p class="small">Vstupenky i&nbsp;na místě, pokud nebude vyprodáno. Změna programu vyhrazena.</p>
  <span class="ig">Sledujte nás na Instagramu</span>
</template>
<script>
  const variants = [
    ['f-cur', 'Současný stav – Noto Serif Display', 'Display řez: vysoký kontrast, vlasové linky, malá x-výška – v malém se rozpadá.', true],
    ['f-ns', 'A · Noto Serif', 'Textový řez téže rodiny. Stejná kostra a kurzíva, má i osu šířky (condensed). Nejmenší změna charakteru.'],
    ['f-ss4', 'B · Source Serif 4', 'Optické velikosti – v malém automaticky robustnější. Velmi čitelný, o něco „knižnější“.'],
    ['f-news', 'C · Newsreader', 'Optické velikosti, redakční a teplejší charakter, pěkná kurzíva. Blízko eleganci Displaye.'],
    ['f-lit', 'D · Literata', 'Navržená pro čtení na obrazovce, nejrobustnější serif tady. Trochu „vážnější“.'],
    ['f-arch', 'E · Archivo (sans)', 'Kontrastní dvojice: groteska s osou šířky pro štítky, tlačítka a odstavce; kurzíva Kdy/Kde zůstává v Displayi.'],
  ];
  const grid = document.getElementById('grid'), tpl = document.getElementById('tpl');
  for (const [cls, name, note, cur] of variants) {
    const v = document.createElement('div');
    v.className = 'v ' + cls + (cur ? ' cur' : '');
    v.innerHTML = `<div class="tag"><b>${name}</b>${note}</div>`;
    v.append(tpl.content.cloneNode(true));
    grid.append(v);
  }
</script>
</body>
</html>
