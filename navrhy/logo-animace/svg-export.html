<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG export</title>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<style>body{margin:0;background:#888 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="10" height="10" fill="%23999"/><rect x="10" y="10" width="10" height="10" fill="%23999"/></svg>');} #out{width:540px;}</style>
</head>
<body>
<div id="out">loading…</div>
<script>
const FILL = '#fec3e8', SX = 0.89, W = 1080, H = 1350;
const lines = [
  {t:'Di',   x:230, y:400, fs:266, f:'sb', lh:1,      main:true},
  {t:'chceme liDI', x:431, y:573, fs:46, f:'it'},
  {t:'vo',   x:431, y:540, fs:266, f:'sb', lh:1,      main:true},
  {t:'chceme VOlnost', x:356, y:772, fs:46, f:'it'},
  {t:'ce!',  x:607, y:663, fs:250, f:'sb', lh:1,      main:true},
  {t:'chceme hodně tanCE', x:621, y:883, fs:46, f:'it'}
];
async function load(url){ const b = await (await fetch(url)).arrayBuffer(); return opentype.parse(b); }
(async () => {
  const fonts = {
    sb: await load('fonts/NotoSerifDisplay/unhinted/ttf/NotoSerifDisplay-ExtraCondensedSemiBold.ttf'),
    it: await load('fonts/NotoSerifDisplay/unhinted/ttf/NotoSerifDisplay-ExtraCondensedItalic.ttf')
  };
  function lineSVG(l){
    const f = fonts[l.f], upm = f.unitsPerEm;
    const A = f.ascender/upm*l.fs, D = -f.descender/upm*l.fs;
    const lg = (f.tables.hhea.lineGap||0)/upm*l.fs;
    const L = l.lh ? l.lh*l.fs : A+D+lg;
    const baseline = (L-(A+D))/2 + A;
    const p = f.getPath(l.t, 0, baseline, l.fs, {kerning:true});
    return `<g transform="translate(${l.x} ${l.y}) scale(${SX} 1)"><path fill="${FILL}" d="${p.toPathData(2)}"/></g>`;
  }
  function svg(ls){
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">\n` +
      ls.map(lineSVG).join('\n') + '\n</svg>';
  }
  window.__svgFull = svg(lines);
  window.__svgMain = svg(lines.filter(l=>l.main));
  document.getElementById('out').innerHTML = window.__svgFull;
  document.title = 'ready';
})().catch(e => { document.getElementById('out').textContent = 'ERR ' + e; });
</script>
</body>
</html>
